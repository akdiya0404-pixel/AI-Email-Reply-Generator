<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Reply Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>AI Email Reply Generator</h1>

    <label>Paste Email</label>

    <textarea
        id="email"
        placeholder="Paste the received email here..."></textarea>

    <label>Select Tone</label>

    <select id="tone">
        <option>Professional</option>
        <option>Friendly</option>
        <option>Formal</option>
        <option>Polite</option>
    </select>

    <button id="generate">
        Generate Reply
    </button>

    <h2>Generated Reply</h2>

    <textarea
        id="reply"
        readonly
        placeholder="AI reply will appear here..."></textarea>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
